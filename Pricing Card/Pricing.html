<!DOCTYPE html>
   <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/Pricing.css">
        <title>Document</title>
    </head>
    <body>
        <section class="pricing" aria-labelledby="pricing-title">
            <div class="container">
                <h2 id="pricing-title">Pilihan Paket Lokakarya</h2>

                <div class="pricing-list">

                    <article class="price-card">
                        <h3>Mandiri</h3>
                        <p class="price">Harga : Gratis</p>
                        <ul class="list"><li>Materi dasar</li><li>Latihan mandiri</li></ul>
                        <a class="button" href="#daftar">Pilih paket</a>
                    </article>

                    <article class="price-card price-card--featured">
                        <p class="badge">Rekomendasi</p>
                        <h3>Terbimbing</h3>
                        <p class="price">Harga : Rp150.000</p>
                        <ul class="list"><li>Materi dasar</li><li>Review tugas</li><li>Code defense</li></ul>
                        <a class="button" href="#daftar">Pilih paket</a>
                    </article>

                    <article class="price-card">
                        <h3>Intensif</h3>
                        <p class="price">Harga : Rp250.000</p>
                        <ul class="list"><li>Semua fasilitas</li><li>Konsultasi tambahan</li></ul>
                        <a class="button" href="#daftar">Pilih paket</a>
                    </article>
                </div>
            </div>
        </section>
    </body>
    </html>
